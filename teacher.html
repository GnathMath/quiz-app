<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Teacher - Create & Grade Quizzes</title>
    <style>
        /* ALL CSS IN ONE FILE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px; 
            min-height: 100vh;
        }
        .app-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .screen { display: none; padding: 20px; }
        .active { display: block; }
        .header {
            background: #667eea;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            margin-right: 15px;
            cursor: pointer;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .question-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .actions { display: flex; gap: 5px; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #333;
            color: white;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; animation: fadeInOut 3s; }
        @keyframes fadeInOut {
            0%,100% { opacity: 0; }
            10%,90% { opacity: 1; }
        }
        .file-upload {
            border: 2px dashed #667eea;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin: 15px 0;
            cursor: pointer;
        }
        .draft-list { margin-top: 20px; }
        .draft-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-settings {
            background: #e8f4ff;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        .timer-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .timer-row input { width: 80px; }
        .csv-preview {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 12px;
        }
        th { background: #667eea; color: white; }
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
        }
        .tab-btn.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Main Screen -->
        <div id="main-screen" class="screen active">
            <div style="text-align: center; padding: 40px 20px;">
                <h1 style="color: #667eea; margin-bottom: 20px;">📚 Quiz Teacher</h1>
                <p style="margin-bottom: 30px; color: #666;">Create encrypted quizzes & grade student responses</p>
                
                <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;">
                    <button onclick="showTab('create')" class="btn btn-primary">
                        <span>📝 Create New Quiz</span>
                    </button>
                    <button onclick="showTab('drafts')" class="btn btn-secondary">
                        <span>📂 Load Draft</span>
                    </button>
                    <button onclick="showTab('grade')" class="btn btn-success">
                        <span>📊 Grade Responses</span>
                    </button>
                    <button onclick="showTab('templates')" class="btn btn-secondary">
                        <span>📋 Question Bank</span>
                    </button>
                </div>
                
                <div style="margin-top: 30px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
                    <p><strong>How to use:</strong></p>
                    <p style="font-size: 14px; margin-top: 10px; text-align: left;">
                        1. Create quiz → Download .quiz file<br>
                        2. Share file + password with students<br>
                        3. Students send back .response files<br>
                        4. Upload responses here to grade<br>
                        5. Export to Excel/CSV
                    </p>
                </div>
            </div>
        </div>

        <!-- Tab Container -->
        <div id="tab-container" class="screen">
            <div class="header">
                <button class="back-btn" onclick="showScreen('main-screen')">←</button>
                <h2 id="tab-title">Create Quiz</h2>
            </div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('create')">Create</button>
                <button class="tab-btn" onclick="switchTab('drafts')">Drafts</button>
                <button class="tab-btn" onclick="switchTab('grade')">Grade</button>
                <button class="tab-btn" onclick="switchTab('templates')">Bank</button>
            </div>
            
            <div id="tab-content" style="padding: 20px;">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="file-input" style="display: none;" accept=".quiz,.response,.json">
    
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ALL JAVASCRIPT IN ONE FILE
        let currentQuiz = {
            name: '',
            password: '',
            responsePassword: '',
            timer: 0, // in minutes
            questions: [],
            draftId: null,
            lastSaved: null
        };

        let questionBank = [];
        let drafts = [];
        let currentTab = 'create';

        // Load saved data from localStorage
        function loadData() {
            try {
                const saved = localStorage.getItem('quizTeacherData');
                if (saved) {
                    const data = JSON.parse(saved);
                    drafts = data.drafts || [];
                    questionBank = data.questionBank || [];
                }
            } catch (e) {
                console.log('No saved data found');
            }
        }

        // Save data to localStorage
        function saveData() {
            const data = {
                drafts: drafts,
                questionBank: questionBank,
                lastUpdated: new Date().toISOString()
            };
            localStorage.setItem('quizTeacherData', JSON.stringify(data));
        }

        // Show screen
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Show tab
        function showTab(tabName) {
            currentTab = tabName;
            showScreen('tab-container');
            document.getElementById('tab-title').textContent = 
                tabName === 'create' ? 'Create Quiz' :
                tabName === 'drafts' ? 'Quiz Drafts' :
                tabName === 'grade' ? 'Grade Responses' :
                'Question Bank';
            
            switchTab(tabName);
        }

        // Switch tab content
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const contentDiv = document.getElementById('tab-content');
            
            if (tabName === 'create') {
                contentDiv.innerHTML = getCreateTabHTML();
                loadDraftToForm();
            } else if (tabName === 'drafts') {
                contentDiv.innerHTML = getDraftsTabHTML();
                loadDraftsList();
            } else if (tabName === 'grade') {
                contentDiv.innerHTML = getGradeTabHTML();
            } else if (tabName === 'templates') {
                contentDiv.innerHTML = getTemplatesTabHTML();
                loadQuestionBank();
            }
        }

        // Tab HTML templates
        function getCreateTabHTML() {
            return `
                <div class="form-group">
                    <label>Quiz Name:</label>
                    <input type="text" id="quiz-name" placeholder="e.g., Math Final Exam" value="${currentQuiz.name}">
                </div>
                
                <div class="form-group">
                    <label>Quiz Password (for students):</label>
                    <input type="password" id="quiz-password" placeholder="Students need this to open" value="${currentQuiz.password}">
                </div>
                
                <div class="form-group">
                    <label>Response Password (for you):</label>
                    <input type="password" id="response-password" placeholder="Keep secret - for grading" value="${currentQuiz.responsePassword}">
                </div>
                
                <div class="timer-settings">
                    <h4>⏰ Timer Settings (Optional)</h4>
                    <div class="timer-row">
                        <input type="number" id="timer-minutes" value="${currentQuiz.timer}" min="0" placeholder="Minutes">
                        <span>minutes (0 = no timer)</span>
                    </div>
                    <small>Timer starts when student opens quiz</small>
                </div>
                
                <div style="margin: 20px 0; text-align: center;">
                    <button class="btn btn-primary" onclick="saveAsDraft()">💾 Save Draft</button>
                    <button class="btn btn-secondary" onclick="loadFromDraft()">📂 Load Draft</button>
                    <button class="btn btn-success" onclick="createQuizFile()">📥 Download Quiz File</button>
                </div>
                
                <hr style="margin: 20px 0;">
                
                <h3>Questions (${currentQuiz.questions.length})</h3>
                
                <div style="display: flex; gap: 10px; margin: 15px 0;">
                    <button class="btn btn-primary" onclick="addQuestion('mcq')">➕ MCQ</button>
                    <button class="btn btn-primary" onclick="addQuestion('fill')">➕ Fill in Blank</button>
                    <button class="btn btn-primary" onclick="addQuestion('tf')">➕ True/False</button>
                    <button class="btn btn-secondary" onclick="addFromBank()">📋 From Bank</button>
                </div>
                
                <div id="questions-container">
                    ${currentQuiz.questions.map((q, i) => getQuestionHTML(q, i)).join('')}
                </div>
            `;
        }

        function getDraftsTabHTML() {
            return `
                <div class="draft-list" id="draft-list">
                    <p>Loading drafts...</p>
                </div>
            `;
        }

        function getGradeTabHTML() {
            return `
                <div class="file-upload" onclick="document.getElementById('file-input').click()">
                    <h3>📁 Upload Response Files</h3>
                    <p>Click to select .response files from students</p>
                    <p><small>You can select multiple files</small></p>
                </div>
                
                <div class="form-group">
                    <label>Response Password:</label>
                    <input type="password" id="grade-password" placeholder="Enter your response password">
                </div>
                
                <button class="btn btn-primary" onclick="gradeResponses()" style="width: 100%;">
                    🔓 Decrypt & Grade Responses
                </button>
                
                <div id="responses-container" style="margin-top: 20px;"></div>
                
                <div id="csv-section" style="display: none; margin-top: 20px;">
                    <h3>Export to Excel/CSV</h3>
                    <div id="csv-preview" class="csv-preview"></div>
                    <button class="btn btn-success" onclick="exportToCSV()">📊 Export to CSV</button>
                    <button class="btn btn-success" onclick="exportToExcel()">📈 Export to Excel</button>
                </div>
            `;
        }

        function getTemplatesTabHTML() {
            return `
                <h3>Question Bank</h3>
                <p>Save questions here to reuse in different quizzes</p>
                
                <div style="margin: 15px 0;">
                    <button class="btn btn-primary" onclick="addToBank()">➕ Add Current Questions to Bank</button>
                </div>
                
                <div id="bank-container" class="draft-list">
                    <p>Loading question bank...</p>
                </div>
            `;
        }

        // Question HTML
        function getQuestionHTML(question, index) {
            return `
                <div class="question-container" id="q-${index}">
                    <div class="question-header">
                        <h4>${index + 1}. ${question.type === 'mcq' ? 'MCQ' : question.type === 'fill' ? 'Fill in Blank' : 'True/False'}</h4>
                        <div class="actions">
                            <button class="btn" onclick="moveQuestionUp(${index})" ${index === 0 ? 'disabled' : ''}>↑</button>
                            <button class="btn" onclick="moveQuestionDown(${index})" ${index === currentQuiz.questions.length - 1 ? 'disabled' : ''}>↓</button>
                            <button class="btn btn-danger" onclick="removeQuestion(${index})">✕</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Question:</label>
                        <textarea id="q-text-${index}" rows="2" placeholder="Enter question...">${question.text}</textarea>
                    </div>
                    
                    ${question.type === 'mcq' ? `
                        <div class="form-group">
                            <label>Options (one per line):</label>
                            <textarea id="q-options-${index}" rows="4" placeholder="A) Option 1\nB) Option 2\nC) Option 3\nD) Option 4">${Object.entries(question.options).map(([key, val]) => `${key}) ${val}`).join('\n')}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Correct Answer:</label>
                            <input type="text" id="q-correct-${index}" value="${question.correctAnswer}" placeholder="A, B, C, or D">
                        </div>
                    ` : question.type === 'fill' ? `
                        <div class="form-group">
                            <label>Correct Answer(s) (comma separated):</label>
                            <input type="text" id="q-correct-${index}" value="${question.correctAnswers.join(', ')}" placeholder="e.g., Paris, paris, PARIS">
                        </div>
                    ` : `
                        <div class="form-group">
                            <label>Correct Answer:</label>
                            <select id="q-correct-${index}">
                                <option value="true" ${question.correctAnswer === true ? 'selected' : ''}>True</option>
                                <option value="false" ${question.correctAnswer === false ? 'selected' : ''}>False</option>
                            </select>
                        </div>
                    `}
                    
                    <div class="form-group">
                        <label>Points:</label>
                        <input type="number" id="q-points-${index}" value="${question.points}" min="1">
                    </div>
                    
                    <div style="text-align: right;">
                        <button class="btn btn-secondary" onclick="saveToBank(${index})">💾 Save to Bank</button>
                    </div>
                </div>
            `;
        }

        // Add question
        function addQuestion(type) {
            const question = {
                id: Date.now(),
                type: type,
                text: '',
                points: 1
            };
            
            if (type === 'mcq') {
                question.options = {A: '', B: '', C: '', D: ''};
                question.correctAnswer = 'A';
            } else if (type === 'fill') {
                question.correctAnswers = [''];
            } else if (type === 'tf') {
                question.correctAnswer = true;
            }
            
            currentQuiz.questions.push(question);
            refreshQuestions();
        }

        // Remove question
        function removeQuestion(index) {
            currentQuiz.questions.splice(index, 1);
            refreshQuestions();
        }

        // Move question up
        function moveQuestionUp(index) {
            if (index > 0) {
                const temp = currentQuiz.questions[index];
                currentQuiz.questions[index] = currentQuiz.questions[index - 1];
                currentQuiz.questions[index - 1] = temp;
                refreshQuestions();
            }
        }

        // Move question down
        function moveQuestionDown(index) {
            if (index < currentQuiz.questions.length - 1) {
                const temp = currentQuiz.questions[index];
                currentQuiz.questions[index] = currentQuiz.questions[index + 1];
                currentQuiz.questions[index + 1] = temp;
                refreshQuestions();
            }
        }

        // Refresh questions display
        function refreshQuestions() {
            if (currentTab === 'create') {
                document.getElementById('questions-container').innerHTML = 
                    currentQuiz.questions.map((q, i) => getQuestionHTML(q, i)).join('');
            }
        }

        // Save current quiz as draft
        function saveAsDraft() {
            // Collect data from form
            currentQuiz.name = document.getElementById('quiz-name')?.value || currentQuiz.name;
            currentQuiz.password = document.getElementById('quiz-password')?.value || currentQuiz.password;
            currentQuiz.responsePassword = document.getElementById('response-password')?.value || currentQuiz.responsePassword;
            currentQuiz.timer = parseInt(document.getElementById('timer-minutes')?.value || 0);
            
            // Save questions from form
            currentQuiz.questions.forEach((q, index) => {
                const textElem = document.getElementById(`q-text-${index}`);
                const pointsElem = document.getElementById(`q-points-${index}`);
                const correctElem = document.getElementById(`q-correct-${index}`);
                
                if (textElem) q.text = textElem.value;
                if (pointsElem) q.points = parseInt(pointsElem.value) || 1;
                
                if (q.type === 'mcq') {
                    const optionsElem = document.getElementById(`q-options-${index}`);
                    if (optionsElem) {
                        const lines = optionsElem.value.split('\n');
                        const options = {};
                        lines.forEach(line => {
                            const match = line.match(/^([A-D])\)\s*(.+)/);
                            if (match) {
                                options[match[1]] = match[2].trim();
                            }
                        });
                        q.options = options;
                    }
                    if (correctElem) q.correctAnswer = correctElem.value;
                } else if (q.type === 'fill') {
                    if (correctElem) q.correctAnswers = correctElem.value.split(',').map(s => s.trim()).filter(s => s);
                } else if (q.type === 'tf') {
                    if (correctElem) q.correctAnswer = correctElem.value === 'true';
                }
            });
            
            // Create draft
            const draft = {
                id: currentQuiz.draftId || Date.now().toString(),
                name: currentQuiz.name || 'Untitled Quiz',
                quiz: JSON.parse(JSON.stringify(currentQuiz)),
                savedAt: new Date().toISOString()
            };
            
            // Remove old draft if exists
            drafts = drafts.filter(d => d.id !== draft.id);
            drafts.unshift(draft);
            
            saveData();
            showToast('Draft saved successfully!');
            currentQuiz.draftId = draft.id;
        }

        // Load draft to form
        function loadDraftToForm() {
            if (currentQuiz.draftId) {
                const draft = drafts.find(d => d.id === currentQuiz.draftId);
                if (draft) {
                    currentQuiz = JSON.parse(JSON.stringify(draft.quiz));
                    currentQuiz.draftId = draft.id;
                }
            }
        }

        // Load from draft
        function loadFromDraft() {
            showTab('drafts');
        }

        // Load drafts list
        function loadDraftsList() {
            const container = document.getElementById('draft-list');
            if (!container) return;
            
            if (drafts.length === 0) {
                container.innerHTML = '<p>No drafts saved yet.</p>';
                return;
            }
            
            container.innerHTML = drafts.map(draft => `
                <div class="draft-item">
                    <div>
                        <strong>${draft.name}</strong><br>
                        <small>${new Date(draft.savedAt).toLocaleString()}</small>
                        <small> • ${draft.quiz.questions.length} questions</small>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="openDraft('${draft.id}')">Open</button>
                        <button class="btn btn-danger" onclick="deleteDraft('${draft.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Open draft
        function openDraft(draftId) {
            const draft = drafts.find(d => d.id === draftId);
            if (draft) {
                currentQuiz = JSON.parse(JSON.stringify(draft.quiz));
                currentQuiz.draftId = draft.id;
                showTab('create');
            }
        }

        // Delete draft
        function deleteDraft(draftId) {
            drafts = drafts.filter(d => d.id !== draftId);
            saveData();
            loadDraftsList();
            showToast('Draft deleted');
        }

        // Load question bank
        function loadQuestionBank() {
            const container = document.getElementById('bank-container');
            if (!container) return;
            
            if (questionBank.length === 0) {
                container.innerHTML = '<p>Question bank is empty.</p>';
                return;
            }
            
            container.innerHTML = questionBank.map((q, i) => `
                <div class="draft-item">
                    <div style="flex: 1;">
                        <strong>${q.type.toUpperCase()}</strong>: ${q.text.substring(0, 50)}${q.text.length > 50 ? '...' : ''}<br>
                        <small>${q.points} point${q.points !== 1 ? 's' : ''}</small>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="useFromBank(${i})">Use</button>
                        <button class="btn btn-danger" onclick="removeFromBank(${i})">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        // Add current questions to bank
        function addToBank() {
            saveAsDraft(); // Save current state first
            
            currentQuiz.questions.forEach(q => {
                // Check if already in bank
                const exists = questionBank.some(bq => 
                    bq.text === q.text && bq.type === q.type
                );
                
                if (!exists) {
                    questionBank.push(JSON.parse(JSON.stringify(q)));
                }
            });
            
            saveData();
            loadQuestionBank();
            showToast('Questions added to bank');
        }

        // Add from bank
        function addFromBank() {
            showTab('templates');
        }

        // Use question from bank
        function useFromBank(index) {
            if (index >= 0 && index < questionBank.length) {
                currentQuiz.questions.push(JSON.parse(JSON.stringify(questionBank[index])));
                refreshQuestions();
                showTab('create');
                showToast('Question added');
            }
        }

        // Remove from bank
        function removeFromBank(index) {
            questionBank.splice(index, 1);
            saveData();
            loadQuestionBank();
            showToast('Removed from bank');
        }

        // Save individual question to bank
        function saveToBank(index) {
            if (index >= 0 && index < currentQuiz.questions.length) {
                const question = currentQuiz.questions[index];
                
                // Check if already exists
                const exists = questionBank.some(q => 
                    q.text === question.text && q.type === question.type
                );
                
                if (!exists) {
                    questionBank.push(JSON.parse(JSON.stringify(question)));
                    saveData();
                    showToast('Question saved to bank');
                } else {
                    showToast('Already in bank');
                }
            }
        }

        // Create quiz file
        // In teacher.html, replace the createQuizFile function:
        async function createQuizFile() {
            // Save current state
            saveAsDraft();
            
            // Get values
            const quizName = document.getElementById('quiz-name').value;
            const quizPassword = document.getElementById('quiz-password').value;
            const responsePassword = document.getElementById('response-password').value;
            
            // Validate
            if (!quizName) {
                showToast('Please enter quiz name', 'error');
                return;
            }
            if (!quizPassword) {
                showToast('Please set quiz password', 'error');
                return;
            }
            
            // Check password strength
            const strength = secureCrypto.checkPasswordStrength(quizPassword);
            if (strength.strength === 'weak') {
                if (!confirm(`Weak password detected!\n\nSuggestions:\n${strength.suggestions.join('\n')}\n\nContinue anyway?`)) {
                    return;
                }
            }
            
            if (!responsePassword) {
                showToast('Please set response password', 'error');
                return;
            }
            
            if (currentQuiz.questions.length === 0) {
                showToast('Please add at least one question', 'error');
                return;
            }
            
            try {
                // Create quiz data
                const quizData = {
                    version: '3.0',
                    type: 'quiz',
                    name: quizName,
                    questions: currentQuiz.questions,
                    timer: currentQuiz.timer,
                    responsePassword: responsePassword,
                    createdAt: new Date().toISOString(),
                    metadata: {
                        totalQuestions: currentQuiz.questions.length,
                        totalPoints: currentQuiz.questions.reduce((sum, q) => sum + q.points, 0)
                    }
                };
                
                // ENCRYPT with password (REAL ENCRYPTION)
                const encryptedData = await secureCrypto.encrypt(quizData, quizPassword);
                
                // Create file with metadata (but NOT the encrypted data in plain text)
                const fileContent = JSON.stringify({
                    type: 'QUIZ_FILE_V3',
                    version: '3.0',
                    encrypted: encryptedData,  // This is now properly encrypted
                    quizName: quizName,
                    createdAt: new Date().toISOString(),
                    hint: `Encrypted with AES-256-GCM. Password required.`
                }, null, 2);
                
                // Download
                const blob = new Blob([fileContent], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${quizName.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.quiz`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast('Secure quiz file downloaded!', 'success');
                
                // Show success message with instructions
                setTimeout(() => {
                    const msg = `✅ Quiz Created Successfully!\n\n` +
                            `Quiz Name: ${quizName}\n` +
                            `Questions: ${currentQuiz.questions.length}\n\n` +
                            `📤 SHARE WITH STUDENTS:\n` +
                            `1. Send the .quiz file\n` +
                            `2. Give them this password:\n   "${quizPassword}"\n\n` +
                            `🔐 KEEP SECRET (for you only):\n` +
                            `Response password: "${responsePassword}"\n\n` +
                            `⚠️ Important:\n` +
                            `- Don't share response password\n` +
                            `- Use different passwords for different quizzes`;
                    alert(msg);
                }, 1000);
                
            } catch (error) {
                console.error('Error creating quiz:', error);
                showToast('Error creating quiz file: ' + error.message, 'error');
            }
        }

        // Update the gradeResponses function too:
        // Grade responses
        async function gradeResponses() {
            const password = document.getElementById('grade-password')?.value;
            if (!password) {
                showToast('Please enter response password', 'error');
                return;
            }
            
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files.length) {
                showToast('Please select response files', 'error');
                return;
            }
            
            try {
                const responses = [];
                const failedFiles = [];
                
                // Process each file
                for (let file of fileInput.files) {
                    try {
                        const text = await readFile(file);
                        const data = JSON.parse(text);
                        
                        if (data.type === 'RESPONSE_FILE_V3' && data.encrypted) {
                            // DECRYPT with password (REAL DECRYPTION)
                            const decrypted = await secureCrypto.decrypt(data.encrypted, password);
                            responses.push(decrypted);
                        } else {
                            failedFiles.push(file.name + ' (invalid format)');
                        }
                    } catch (error) {
                        failedFiles.push(file.name + ' (' + error.message + ')');
                    }
                }
                
                if (responses.length === 0) {
                    showToast('No valid response files could be decrypted', 'error');
                    if (failedFiles.length > 0) {
                        alert('Failed files:\n' + failedFiles.join('\n'));
                    }
                    return;
                }
                
                displayResponses(responses);
                
                if (failedFiles.length > 0) {
                    showToast(`Decrypted ${responses.length} files, failed ${failedFiles.length}`, 'warning');
                }
                
            } catch (error) {
                console.error('Error grading:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        // File integrity check
        async function verifyFileIntegrity(encryptedData, password) {
            try {
                await secureCrypto.decrypt(encryptedData, password);
                return true;
            } catch (error) {
                if (error.message.includes('tag mismatch')) {
                    throw new Error('File has been tampered with!');
                }
                throw error;
            }
        }
        
        // Display responses
        function displayResponses(responses) {
            const container = document.getElementById('responses-container');
            const csvSection = document.getElementById('csv-section');
            
            let html = `<h3>Responses (${responses.length} students)</h3>`;

                html += `
                    <div class="draft-item">
                        <div>
                            <strong>Student: ${resp.regNumber || 'Anonymous'}</strong><br>
                            <small>Quiz: ${resp.quizName}</small><br>
                            <small>Submitted: ${new Date(resp.submittedAt).toLocaleString()}</small>
                        </div>

                    </div>

        // Generate CSV preview
        function generateCSVPreview(responses) {
            if (responses.length === 0) return;
            
            // Get all questions from first response (assuming same quiz)
            const firstResp = responses[0];
            const questions = firstResp.questions || [];
            
            let tableHTML = '<table><tr><th>Reg Number</th>';
            
            // Question headers
            questions.forEach((q, i) => {
                tableHTML += `<th>Q${i + 1}</th>`;
            });
            tableHTML += '<th>Score</th><th>Submitted</th></tr>';
            
            // Data rows
            responses.forEach(resp => {
                tableHTML += `<tr><td>${resp.regNumber || ''}</td>`;
                
                questions.forEach((q, i) => {
                    const answer = resp.answers && resp.answers[i] ? resp.answers[i] : '';
                    tableHTML += `<td>${answer}</td>`;
                });
                
                tableHTML += `<td>${resp.score || ''}</td>`;
                tableHTML += `<td>${new Date(resp.submittedAt).toLocaleDateString()}</td></tr>`;
            });
            
            tableHTML += '</table>';
            document.getElementById('csv-preview').innerHTML = tableHTML;
        }

        // Export to CSV
        function exportToCSV() {
            if (!window.responsesData || window.responsesData.length === 0) {
                showToast('No data to export');
                return;
            }
            
            const data = window.responsesData;
            const firstResp = data[0];
            const questions = firstResp.questions || [];
            
            // Create CSV header
            let csv = 'Registration Number,';
            questions.forEach((q, i) => {
                csv += `Q${i + 1},`;
            });
            csv += 'Score,Submitted Date\n';
            
            // Add data rows
            data.forEach(resp => {
                csv += `"${resp.regNumber || ''}",`;
                
                questions.forEach((q, i) => {
                    const answer = resp.answers && resp.answers[i] ? resp.answers[i] : '';
                    csv += `"${answer}",`;
                });
                
                csv += `"${resp.score || ''}",`;
                csv += `"${new Date(resp.submittedAt).toLocaleDateString()}"\n`;
            });
            
            // Download
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `quiz_results_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('CSV exported successfully!');
        }

        // Export to Excel
        function exportToExcel() {
            // For simplicity, we'll create an HTML table that Excel can open
            exportToCSV(); // CSV works in Excel too
        }

        // File reading helper
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file);
            });
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        //Detailed logs
        // Add this function to teacher.html
        function displayDetailedLogs(responseData) {
            const container = document.getElementById('responses-container');
            
            if (!responseData.activityLogs) {
                container.innerHTML += '<p>No activity logs available in this response file.</p>';
                return;
            }
            
            const logs = responseData.activityLogs;
            
            let html = `

                    <h3>📊 Comprehensive Activity Logs</h3>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0;">
                        <div style="background: #e8f4ff; padding: 15px; border-radius: 5px;">
                            <div style="font-size: 24px; font-weight: bold; color: #1890ff;">${logs.summary.tabSwitches || 0}</div>
                            <div style="font-size: 14px; color: #666;">Tab Switches</div>
                        </div>
                        <div style="background: #f0f9ff; padding: 15px; border-radius: 5px;">

                            <div style="font-size: 14px; color: #666;">Internet Changes</div>
                        </div>
                        <div style="background: #fff7e6; padding: 15px; border-radius: 5px;">
                            <div style="font-size: 24px; font-weight: bold; color: #fa8c16;">${logs.summary.copyAttempts || 0}</div>
                            <div style="font-size: 14px; color: #666;">Copy Attempts</div>
                        </div>
                        <div style="background: #fff1f0; padding: 15px; border-radius: 5px;">
                            <div style="font-size: 24px; font-weight: bold; color: #f5222d;">${logs.summary.devToolsAttempts || 0}</div>
                            <div style="font-size: 14px; color: #666;">Dev Tools Attempts</div>
                        </div>
                    </div>
                    
                    <h4>Timeline of Events</h4>
                    <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; padding: 10px; margin: 10px 0;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #f5f5f5;">
                                    <th style="padding: 8px; border: 1px solid #ddd;">Time (s)</th>
                                    <th style="padding: 8px; border: 1px solid #ddd;">Event</th>
                                    <th style="padding: 8px; border: 1px solid #ddd;">Details</th>
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            if (logs.detailedLogs && logs.detailedLogs.length > 0) {
                const startTime = logs.detailedLogs[0]?.timestamp || Date.now();
                
                logs.detailedLogs.forEach((log, index) => {
                    if (index > 100) return; // Limit display
                    
                    const timeFromStart = ((log.timestamp - startTime) / 1000).toFixed(1);
                    let eventDescription = '';
                    let details = '';
                    
                    switch (log.type) {
                        case 'went_online':
                            eventDescription = '📶 Internet Connected';
                            details = `After ${(log.data.durationOffline / 1000).toFixed(1)}s offline`;
                            break;
                        case 'went_offline':
                            eventDescription = '📵 Internet Disconnected';
                            details = `Change #${log.data.changeCount}`;
                            break;
                        case 'tab_hidden':
                            eventDescription = '📑 Tab Switched Away';
                            details = `Switch #${log.data.switchCount}`;
                            break;
                        case 'tab_visible':
                            eventDescription = '📖 Tab Returned';
                            details = `Was away for ${((log.timestamp - logs.detailedLogs[index-1]?.timestamp) / 1000).toFixed(1)}s`;
                            break;
                        case 'right_click_attempt':
                            eventDescription = '🖱️ Right Click';
                            details = `On ${log.data.target}`;
                            break;
                        case 'copy_attempt':
                            eventDescription = '📋 Copy Attempt';
                            details = log.data.selection ? `"${log.data.selection.substring(0, 30)}..."` : 'Empty selection';
                            break;
                        case 'devtools_shortcut_attempt':
                            eventDescription = '⚙️ Dev Tools Shortcut';
                            details = `Keys: ${log.data.keyCombo}`;
                            break;
                        case 'page_close_attempt':
                            eventDescription = '❌ Page Close Attempt';
                            details = `Attempt #${log.data.attemptCount}`;
                            break;
                        case 'answer_selected':
                            eventDescription = '✅ Answer Selected';
                            details = `Q${log.data.questionIndex + 1}: ${log.data.answer}`;
                            break;
                        case 'timer_expired_auto_submit':
                            eventDescription = '⏰ Time Expired';
                            details = 'Auto-submitted';
                            break;
                        default:
                            eventDescription = log.type;
                            details = JSON.stringify(log.data).substring(0, 50);

                    html += `
                        <tr>
                            <td style="padding: 8px; border: 1px solid #ddd;">${timeFromStart}s</td>
                            <td style="padding: 8px; border: 1px solid #ddd;">${eventDescription}</td>

                            <div><strong>Blur Time:</strong> ${logs.summary.blurTime || 0}s</div>
                            <div><strong>Final Integrity:</strong> ${logs.summary.finalIntegrityHash || 'Unknown'}</div>
                        </div>
                    </div>
                    
                    <h4>Suspicious Activity Summary</h4>
                    <div style="margin: 10px 0;">
            `;
            
            const suspiciousActivities = [];
            if ((logs.summary.tabSwitches || 0) > 5) {
                suspiciousActivities.push(`High tab switching (${logs.summary.tabSwitches} times)`);
            }
            if ((logs.summary.internetChanges || 0) > 3) {
                suspiciousActivities.push(`Frequent internet changes (${logs.summary.internetChanges} times)`);
            }
            if ((logs.summary.copyAttempts || 0) > 0) {
                suspiciousActivities.push(`Copy attempts detected (${logs.summary.copyAttempts} times)`);
            }
            if ((logs.summary.devToolsAttempts || 0) > 0) {
                suspiciousActivities.push(`Developer tools attempts (${logs.summary.devToolsAttempts} times)`);
            }
            if ((logs.summary.rightClickAttempts || 0) > 10) {
                suspiciousActivities.push(`Excessive right-clicks (${logs.summary.rightClickAttempts} times)`);
            }
            
            if (suspiciousActivities.length > 0) {
                html += `<div style="background: #fff2f0; padding: 15px; border-radius: 5px; border-left: 4px solid #ff4d4f;">`;
                html += `<strong>⚠️ Suspicious Activities Detected:</strong><ul>`;

            html += `
                    </div>
                    
                    <button onclick="exportLogsToCSV(${JSON.stringify(logs)})" class="btn btn-secondary" style="margin-top: 15px;">

                    </button>
                </div>
            `;
            
            container.innerHTML += html;
        }

        // Add this function to export logs
        function exportLogsToCSV(logs) {
            if (!logs || !logs.detailedLogs) {
                showToast('No logs to export');
                return;
            }
            
            let csv = 'Time (s),Event,Details\n';
            
            const startTime = logs.detailedLogs[0]?.timestamp || Date.now();
            
            logs.detailedLogs.forEach(log => {
                const timeFromStart = ((log.timestamp - startTime) / 1000).toFixed(1);
                
                let eventDescription = log.type;
                let details = '';
                
                switch (log.type) {
                    case 'went_online':
                        eventDescription = 'Internet Connected';
                        details = `After ${(log.data.durationOffline / 1000).toFixed(1)}s offline`;
                        break;
                    case 'went_offline':
                        eventDescription = 'Internet Disconnected';
                        details = `Change #${log.data.changeCount}`;
                        break;
                    case 'tab_hidden':
                        eventDescription = 'Tab Switched Away';
                        details = `Switch #${log.data.switchCount}`;
                        break;
                    case 'tab_visible':
                        eventDescription = 'Tab Returned';
                        break;
                    case 'right_click_attempt':
                        eventDescription = 'Right Click';
                        details = `On ${log.data.target}`;
                        break;
                    case 'copy_attempt':
                        eventDescription = 'Copy Attempt';
                        details = log.data.selection || '';
                        break;
                    case 'devtools_shortcut_attempt':
                        eventDescription = 'Dev Tools Shortcut';
                        details = `Keys: ${log.data.keyCombo}`;
                        break;
                    default:
                        details = JSON.stringify(log.data);
                }
                
                csv += `"${timeFromStart}","${eventDescription}","${details.replace(/"/g, '""')}"\n`;
            });
            
            // Download CSV
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `activity_logs_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Logs exported to CSV');
        }
